name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Smoke built renderer with synthetic data
        run: .\node_modules\.bin\electron.cmd tests\packaged-smoke.cjs
      - run: npm run lint
      - name: Check workflow and tooling formatting
        run: npm run format:check
      - run: npm audit --audit-level=high
      - name: Scan full Git history for secrets
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          $tool = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          if ($hash -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') { throw 'Gitleaks checksum mismatch' }
          Expand-Archive $zip -DestinationPath $tool
          & (Join-Path $tool 'gitleaks.exe') git --redact --no-banner --no-color .
          if ($LASTEXITCODE -ne 0) { throw 'Gitleaks found a secret or could not complete the scan' }

  windows-release:
    # Phase 5 was explicitly accepted for the local 0.9.0-rc.1 build; see
    # docs/clean-machine-verification.md. Tagging and publishing still require
    # a separate owner decision after the source and final artifact checks.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require tag and package version to agree
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -cne "v$($package.version)") { throw 'Release tag does not match package.json version' }
      - run: npm run dist:win
      - name: Check exact release EXEs and write SHA-256 checksums
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $package.version
          $name = $package.build.productName
          $expected = @("$name Setup $version.exe", "$name $version.exe")
          $found = @(Get-ChildItem release -File -Filter '*.exe' | Sort-Object Name)
          if ($found.Count -ne 2) { throw 'Expected exactly one installer and one portable EXE' }
          foreach ($exe in $found) {
            if ($expected -notcontains $exe.Name -or $exe.Length -eq 0) { throw "Unexpected or empty release EXE: $($exe.Name)" }
          }
          $found | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release/*.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: botland-windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
